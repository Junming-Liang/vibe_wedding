# 同域名 + 子路径（不新开子域名，与 WordPress 并存）
# ——————————————————————————————————————————————————————————
# 前提：vite.config.ts 里 BASE 与下面路径一致（默认 /wedding-invite/），并已执行 npm run build。
#
# 部署文件布局（推荐，用 root 写法最省心）：
#   把 dist 里的所有文件拷到站点根下的子目录，例如：
#     sudo mkdir -p /var/www/html/wedding-invite
#     sudo rsync -a --delete /root/program/vibe_wedding/einvatation_card/dist/ /var/www/html/wedding-invite/
#   若你的 WordPress 根目录不是 /var/www/html，请改成你站点实际 document root。
#
# 将下面两段 location 粘贴进「已有」的 jamilblog.top 的 server { ... } 里，
# 且放在 WordPress 的 location / 之前（^~ 会优先匹配该前缀，不交给 PHP）。
# ——————————————————————————————————————————————————————————

location = /wedding-invite {
    return 301 /wedding-invite/;
}

location ^~ /wedding-invite/ {
    root /var/www/html;
    try_files $uri $uri/ /wedding-invite/index.html;
}

# 注意：WordPress 后台不要创建固定链接 slug 为 wedding-invite 的页面，否则可能与静态目录冲突。
