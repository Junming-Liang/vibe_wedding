# 同域名 + 子路径（与 WordPress 并存）
# 当前项目默认路径：/invite-2026/（vite.config.ts 中 BASE 须一致）
#
# 部署示例（WordPress 根为 /home/wwwroot/wordpress 时）：
#   rsync -a --delete dist/ /home/wwwroot/wordpress/invite-2026/
#
# 将下面 location 粘贴进 jamilblog.top 的 server { ... }，放在 PHP 规则之前。

location = /invite-2026 {
    return 301 /invite-2026/;
}

location ^~ /invite-2026/ {
    try_files $uri $uri/ /invite-2026/index.html;
}

# WordPress 后台不要创建 slug 为 invite-2026 的页面。
