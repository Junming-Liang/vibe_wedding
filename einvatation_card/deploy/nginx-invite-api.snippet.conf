# 与「同域名 + 子路径请柬（/invite-2026/）」配合：仅把 /invite-2026/api/ 反代到留言服务。
#
# WordPress 同域部署时请务必使用本路径，不要使用站点根路径 location /api/：
# 根 /api 可能被主题、插件或其它站点占用，反代后会与 WordPress 抢路由。
#
# 前端默认请求：/invite-2026/api/... ；Node 服务仍为 /api/... ，故 proxy_pass 带 /api/ 尾斜杠做前缀替换。
# 插入到已有 server { ... } 内，与 location ^~ /invite-2026/ 并存即可（Nginx 会按最长前缀匹配本段）。
# 若缺少本段，浏览器对 /invite-2026/api/... 的 POST 会落到静态 invite-2026 规则上，易出现「提交失败 405」。
#
# 1) 服务器运行 Node 服务（示例端口 3840，默认仅监听 127.0.0.1），并配置 CORS_ORIGINS 含本站 Origin
# 2) 合并配置后：sudo nginx -t && sudo systemctl reload nginx

location ^~ /invite-2026/api/ {
    proxy_pass http://127.0.0.1:3840/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
